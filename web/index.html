<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="ABC English 分级英语词汇学习网站" />
    <!-- 浏览器地址栏、任务切换器和安装后窗口使用的品牌主题色。 -->
    <meta name="theme-color" content="#4f46e5" />
    <!-- 以下三项为 iOS/iPadOS“添加到主屏幕”的兼容配置。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ABC English" />
    <!-- manifest 是浏览器判断名称、启动页、显示模式和图标的 PWA 元数据入口。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 普通网页图标与 Apple 主屏幕图标；路径必须是可公开访问的同源静态资源。 -->
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon.svg" />
    <title>ABC English</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
